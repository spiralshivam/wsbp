# Render blueprint: deploys the Flask backend. Frontend is deployed separately (Netlify).
services:
  - type: web
    name: weather-station-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
